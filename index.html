<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#001006">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PIP-NAV">
<title>PIP-NAV V0.5.1</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css">
<style>
:root{--g:#39ff72;--b:#7dff9e;--d:#117532;--bg:#001006;--p:rgba(0,12,4,.94)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--g);font-family:"Courier New",monospace}
#map{position:absolute;inset:0;background:var(--bg)}
#phosphor,#scanlines,#vignette{position:fixed;inset:0;pointer-events:none}
#phosphor{z-index:5;background:radial-gradient(circle,rgba(57,255,114,.02),rgba(0,20,5,.09))}
#scanlines{z-index:40;opacity:.22;background:repeating-linear-gradient(0deg,rgba(0,0,0,.16),rgba(0,0,0,.16) 1px,transparent 1px,transparent 4px)}
#vignette{z-index:39;box-shadow:inset 0 0 70px rgba(0,0,0,.5)}
#header{position:fixed;top:0;left:0;right:0;z-index:20;padding:calc(9px + env(safe-area-inset-top)) 12px 8px;background:rgba(0,10,3,.94);border-bottom:1px solid var(--g)}
#headerTop{display:flex;justify-content:space-between;align-items:center;gap:8px}
#title{font-size:24px;font-weight:bold;letter-spacing:4px;text-shadow:0 0 9px var(--g)}
#tabs{font-size:9px;white-space:nowrap} #gps{font-size:9px;white-space:nowrap}
#subtitle{margin-top:3px;font-size:8px;letter-spacing:1px;opacity:.6}
#search{position:fixed;z-index:20;top:calc(80px + env(safe-area-inset-top));left:10px;right:10px;background:var(--p);border:1px solid var(--g);padding:9px 11px}
#search small{opacity:.6} #destination{width:100%;margin-top:4px;border:0;outline:0;background:transparent;color:var(--b);font:15px "Courier New",monospace}
#turn{display:none;position:fixed;z-index:20;top:calc(80px + env(safe-area-inset-top));left:8px;right:8px;min-height:105px;padding:9px;background:var(--p);border:2px solid var(--g);box-shadow:0 0 10px rgba(57,255,114,.25)}
#turnGrid{display:grid;grid-template-columns:65px 1fr 82px;gap:8px;align-items:center}
#arrow{font:56px Arial;text-align:center;filter:drop-shadow(0 0 6px var(--g))}
#instruction{font-size:18px;font-weight:bold;text-shadow:0 0 6px var(--g)}
#street{font-size:12px;margin-top:5px} #then{font-size:8px;margin-top:6px;opacity:.65}
#tripTop{border-left:1px solid var(--g);padding-left:9px;font-size:9px;line-height:1.45}.big{font-size:14px;font-weight:bold}
#hud{position:fixed;z-index:20;bottom:calc(52px + env(safe-area-inset-bottom));left:7px;right:7px;background:var(--p);border:1px solid var(--g)}
#status{padding:6px 8px;border-bottom:1px solid var(--d);font-size:8px}
#stats{display:grid;grid-template-columns:repeat(4,1fr);text-align:center}.stat{padding:7px 2px;border-right:1px solid var(--d)}.stat:last-child{border:0}.label,.unit{font-size:7px;opacity:.6}.value{font-size:17px;font-weight:bold;text-shadow:0 0 7px var(--g)}
#controls{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--d)}button{min-height:38px;border:0;border-right:1px solid var(--d);background:transparent;color:var(--g);font:bold 8px "Courier New",monospace}button:last-child{border:0}
#bottom{position:fixed;z-index:20;bottom:0;left:0;right:0;height:calc(46px + env(safe-area-inset-bottom));padding-top:10px;display:flex;justify-content:space-around;background:#000803;border-top:1px solid var(--g);font-size:9px}
.player{width:52px;height:52px;border:2px solid rgba(57,255,114,.4);border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(0,12,4,.28);box-shadow:0 0 8px var(--g),0 0 18px rgba(57,255,114,.4)}
.playerArrow{width:0;height:0;border-left:11px solid transparent;border-right:11px solid transparent;border-bottom:31px solid var(--b);filter:drop-shadow(0 0 5px var(--g))}
.objective{font-size:30px;color:var(--b);text-shadow:0 0 8px var(--g)}
#toast{display:none;position:fixed;z-index:60;left:50%;top:50%;transform:translate(-50%,-50%);width:82%;padding:22px;background:#000803;border:2px solid var(--g);text-align:center;font-weight:bold}
.maplibregl-ctrl-attrib{font-size:7px!important;opacity:.5}
@media(max-width:390px){#tabs{display:none}#instruction{font-size:16px}}
</style>
</head>
<body>
<div id="map"></div><div id="phosphor"></div><div id="scanlines"></div><div id="vignette"></div>
<header id="header"><div id="headerTop"><div id="title">PIP-NAV</div><div id="tabs">[ MAP ] &nbsp; [ NAV ] &nbsp; [ DATA ]</div><div id="gps">GPS ○ &nbsp; V0.5.1</div></div><div id="subtitle">ROBCO INDUSTRIES // MOBILE NAVIGATION TERMINAL</div></header>
<div id="search"><small>DESTINATION</small><input id="destination" placeholder="> SEARCH WASTELAND..." autocomplete="off"></div>
<div id="turn"><div id="turnGrid"><div id="arrow">↑</div><div><div id="instruction">CONTINUE</div><div id="street">--</div><div id="then">ROUTE GUIDANCE ACTIVE</div></div><div id="tripTop"><span class="big" id="topDist">--</span> MI<br>REMAINING<br><br><span class="big" id="topEta">--</span><br>ETA<br><span class="big" id="arrival">--</span><br>ARRIVAL</div></div></div>
<div id="hud"><div id="status">&gt; SYSTEM READY // GPS STANDBY</div><div id="stats">
<div class="stat"><div class="label">SPD</div><div class="value" id="speed">--</div><div class="unit">MPH</div></div>
<div class="stat"><div class="label">DIST</div><div class="value" id="dist">--</div><div class="unit">MI</div></div>
<div class="stat"><div class="label">ETA</div><div class="value" id="eta">--</div><div class="unit">REM</div></div>
<div class="stat"><div class="label">HDG</div><div class="value" id="hdg">--</div><div class="unit" id="deg">--°</div></div>
</div><div id="controls"><button id="nav">[ ACQUIRE GPS ]</button><button id="center">[ RECENTER ]</button><button id="voice">[ VOICE ON ]</button></div></div>
<div id="bottom"><span>[ MAP ]</span><span>[ NAV ]</span><span>[ DATA ]</span></div>
<div id="toast">OBJECTIVE REACHED</div>
<script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>
<script>
const $=x=>document.getElementById(x);
let user=null,marker=null,objMarker=null,watch=null,dest=null,destName="",route=null,steps=[],stepIndex=0,navActive=false,follow=false,voiceOn=true,heading=null;
let lastFix=null,lastReroute=0,lastReroutePos=null,lastProgress=0,promptState={},routeDistance=0,routeDuration=0,voiceUnlocked=false;
const map=new maplibregl.Map({container:"map",style:"https://tiles.openfreemap.org/styles/liberty",center:[-74.25,40.4],zoom:9,attributionControl:true});
map.on("load",()=>{styleMap();$("status").textContent="> MAP DATABASE ONLINE // GPS STANDBY"});
function styleMap(){const s=map.getStyle();if(!s?.layers)return;s.layers.forEach(l=>{let id=l.id.toLowerCase();try{
if(l.type==="background")map.setPaintProperty(l.id,"background-color","#001006");
if(l.type==="fill"&&id.includes("water")){map.setPaintProperty(l.id,"fill-color","#000402");map.setPaintProperty(l.id,"fill-opacity",1)}
if(l.type==="fill"&&/(land|park|wood|grass|forest|building)/.test(id)){map.setPaintProperty(l.id,"fill-color",id.includes("building")?"#073017":"#001207");map.setPaintProperty(l.id,"fill-opacity",id.includes("building")?.45:.72)}
if(l.type==="line"&&/(road|street|transport|motorway|trunk|primary|secondary|tertiary)/.test(id)){let c="#126a2c",o=.62;if(/motorway|trunk/.test(id)){c="#43e86e";o=.9}else if(id.includes("primary")){c="#2fc45a";o=.84}else if(id.includes("secondary")){c="#24a84a";o=.77};map.setPaintProperty(l.id,"line-color",c);map.setPaintProperty(l.id,"line-opacity",o)}
if(l.type==="symbol"){map.setPaintProperty(l.id,"text-color","#58dc7b");map.setPaintProperty(l.id,"text-halo-color","#001006");map.setPaintProperty(l.id,"text-halo-width",1.5);map.setPaintProperty(l.id,"text-opacity",.86)}
}catch(e){}})}
function miles(a,b){const R=3958.8,p=Math.PI/180,dLat=(b[1]-a[1])*p,dLon=(b[0]-a[0])*p,la1=a[1]*p,la2=b[1]*p,x=Math.sin(dLat/2)**2+Math.cos(la1)*Math.cos(la2)*Math.sin(dLon/2)**2;return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x))}
function bearing(a,b){let p=Math.PI/180,y=Math.sin((b[0]-a[0])*p)*Math.cos(b[1]*p),x=Math.cos(a[1]*p)*Math.sin(b[1]*p)-Math.sin(a[1]*p)*Math.cos(b[1]*p)*Math.cos((b[0]-a[0])*p);return(Math.atan2(y,x)/p+360)%360}
function cardinal(d){return["N","NE","E","SE","S","SW","W","NW"][Math.round(d/45)%8]}
function setHeading(d){if(d==null||isNaN(d))return;heading=(d+360)%360;$("hdg").textContent=cardinal(heading);$("deg").textContent=Math.round(heading)+"°"}
function mkMarker(){let e=document.createElement("div");e.className="player";let a=document.createElement("div");a.className="playerArrow";e.appendChild(a);marker=new maplibregl.Marker({element:e,anchor:"center"})}
function updateFix(p){const c=p.coords,raw=[c.longitude,c.latitude];if(lastFix){const alpha=.35;user=[lastFix[0]+(raw[0]-lastFix[0])*alpha,lastFix[1]+(raw[1]-lastFix[1])*alpha]}else user=raw;lastFix=user;
if(!marker){mkMarker();marker.setLngLat(user).addTo(map)}else marker.setLngLat(user);
let mph=c.speed!=null?Math.max(0,c.speed*2.23694):0;$("speed").textContent=Math.round(mph);if(mph>3&&c.heading!=null)setHeading(c.heading);$("gps").innerHTML="GPS ● &nbsp; V0.5.1";
if(navActive)updateNav();else $("status").textContent="> POSITION TRACKING ACTIVE";camera()}
function camera(){if(!follow||!user)return;let z=navActive?adaptiveZoom():15;map.easeTo({center:user,zoom:z,bearing:navActive&&heading!=null?heading:0,pitch:navActive?22:0,duration:450})}
function adaptiveZoom(){let s=steps[stepIndex];if(!s)return 15;let m=distanceToStep(s);if(m<150)return 17;if(m<800)return 16;if(m<3200)return 15;return 14.5}
function gpsError(e){$("gps").textContent="GPS × V0.5.1";$("status").textContent="> GPS ERROR // "+e.message}
function compass(){if(typeof DeviceOrientationEvent!=="undefined"&&typeof DeviceOrientationEvent.requestPermission==="function")DeviceOrientationEvent.requestPermission().then(x=>{if(x==="granted")listenCompass()}).catch(()=>{});else listenCompass()}
function listenCompass(){window.addEventListener("deviceorientation",e=>{let h=typeof e.webkitCompassHeading==="number"?e.webkitCompassHeading:(e.alpha!=null?360-e.alpha:null);if(h!=null)setHeading(h)},true)}
function startGPS(){compass();follow=true;$("status").textContent="> ACQUIRING GPS SIGNAL...";watch=navigator.geolocation.watchPosition(updateFix,gpsError,{enableHighAccuracy:true,maximumAge:250,timeout:15000});$("nav").textContent="[ TRACKING ]"}
async function search(q){if(!user){$("status").textContent="> ACQUIRE GPS BEFORE NAVIGATION";return} $("status").textContent="> SEARCHING WASTELAND DATABASE...";
try{let r=await fetch("https://nominatim.openstreetmap.org/search?format=json&limit=1&q="+encodeURIComponent(q)),j=await r.json();if(!j.length)throw 0;dest=[+j[0].lon,+j[0].lat];destName=j[0].display_name.split(",")[0];makeObjective();await calculate(true)}catch(e){$("status").textContent="> DESTINATION / NETWORK ERROR"}}
function makeObjective(){if(objMarker)objMarker.remove();let e=document.createElement("div");e.className="objective";e.textContent="⚑";objMarker=new maplibregl.Marker({element:e,anchor:"bottom"}).setLngLat(dest).addTo(map)}
async function calculate(initial=false){if(!user||!dest)return;try{let u=`https://router.project-osrm.org/route/v1/driving/${user[0]},${user[1]};${dest[0]},${dest[1]}?overview=full&geometries=geojson&steps=true`,r=await fetch(u),j=await r.json();if(!j.routes?.length)throw 0;let x=j.routes[0];route=x.geometry;steps=x.legs[0].steps;stepIndex=findFirstUsefulStep();promptState={};routeDistance=x.distance;routeDuration=x.duration;drawRoute();stats(x.distance,x.duration);navActive=true;follow=!initial;$("search").style.display="none";$("turn").style.display="block";$("nav").textContent="[ END NAV ]";$("status").textContent="> NAVIGATION ACTIVE // FOLLOWING ROUTE";lastReroute=Date.now();lastReroutePos=[...user];updateTurn();if(initial){overview();setTimeout(()=>speak(`Navigation initiated. ${ (x.distance/1609.344).toFixed(1) } miles to ${destName}. Estimated travel time ${Math.max(1,Math.round(x.duration/60))} minutes.`),350)}else follow=true}catch(e){$("status").textContent="> ROUTING COMPUTER ERROR"}}
function findFirstUsefulStep(){for(let i=0;i<steps.length;i++)if(steps[i].distance>20||steps[i].maneuver?.type==="turn")return i;return 0}
function drawRoute(){["route-core","route-glow","route-shadow"].forEach(x=>{if(map.getLayer(x))map.removeLayer(x)});if(map.getSource("route"))map.removeSource("route");map.addSource("route",{type:"geojson",data:{type:"Feature",properties:{},geometry:route}});
const common={source:"route",type:"line",layout:{"line-join":"round","line-cap":"round"}};
map.addLayer({...common,id:"route-shadow",paint:{"line-color":"#001006","line-width":15}});
map.addLayer({...common,id:"route-glow",paint:{"line-color":"#39ff72","line-width":13,"line-opacity":.38,"line-blur":5}});
map.addLayer({...common,id:"route-core",paint:{"line-color":"#72ff96","line-width":5.5}})}
function overview(){let b=new maplibregl.LngLatBounds();route.coordinates.forEach(c=>b.extend(c));map.fitBounds(b,{padding:{top:210,bottom:190,left:25,right:25},duration:900})}
function stats(m,s){routeDistance=m;routeDuration=s;let mi=m/1609.344,min=Math.max(1,Math.round(s/60)),et=min>=60?Math.floor(min/60)+"H"+String(min%60).padStart(2,"0"):min+"M";$("dist").textContent=$("topDist").textContent=mi.toFixed(1);$("eta").textContent=$("topEta").textContent=et;$("arrival").textContent=new Date(Date.now()+s*1000).toLocaleTimeString([],{hour:"numeric",minute:"2-digit"})}
function distanceToStep(s){return s?.maneuver?.location&&user?miles(user,s.maneuver.location)*1609.344:999999}
function human(m){if(m>=161)return(m/1609.344).toFixed(1)+" MI";return Math.max(50,Math.round(m*3.28084/50)*50)+" FT"}
function symbol(s){let m=s?.maneuver?.modifier||"";if(m.includes("right"))return"↱";if(m.includes("left"))return"↰";if(m.includes("uturn"))return"↶";return"↑"}
function action(s){let t=s?.maneuver?.type,m=(s?.maneuver?.modifier||"").toUpperCase();if(t==="turn")return"TURN "+m;if(t==="merge")return"MERGE "+m;if(t==="fork")return"KEEP "+m;if(t==="roundabout")return"ENTER ROUNDABOUT";if(t==="arrive")return"OBJECTIVE";return"CONTINUE"}
function updateTurn(){let s=steps[stepIndex];if(!s)return;$("arrow").textContent=symbol(s);$("instruction").textContent=action(s)+" IN "+human(distanceToStep(s));$("street").textContent=s.name||"UNNAMED ROAD";let n=steps[stepIndex+1];$("then").textContent=n?"THEN: "+((n.maneuver?.modifier||"STRAIGHT").toUpperCase())+(n.name?" ON "+n.name:""):"OBJECTIVE APPROACHING"}
function speak(t,force=false){
 if((!voiceOn&&!force)||!("speechSynthesis" in window))return false;
 try{
  speechSynthesis.cancel();
  speechSynthesis.resume();
  let u=new SpeechSynthesisUtterance(t);
  u.rate=1.02;u.volume=1;u.pitch=1;
  const voices=speechSynthesis.getVoices();
  const preferred=voices.find(v=>/^en[-_]US/i.test(v.lang))||voices.find(v=>/^en/i.test(v.lang));
  if(preferred)u.voice=preferred;
  u.onstart=()=>{voiceUnlocked=true;$('status').textContent='> VOICE GUIDANCE ONLINE'};
  u.onerror=()=>{$('status').textContent='> VOICE OUTPUT BLOCKED // TAP VOICE AGAIN'};
  speechSynthesis.speak(u);
  return true;
 }catch(e){$('status').textContent='> VOICE OUTPUT ERROR';return false}
}
function testVoice(){
 voiceOn=true;$('voice').textContent='[ VOICE ON ]';
 $('status').textContent='> INITIALIZING VOICE GUIDANCE...';
 speak('PIP NAV voice guidance online.',true);
}
function stagedVoice(s,m){let key=stepIndex+"",st=promptState[key]||0;if(m<45&&st<3){speak(action(s)+(s.name?" onto "+s.name:""));promptState[key]=3}else if(m<180&&st<2){speak("In 500 feet, "+action(s).toLowerCase()+(s.name?" onto "+s.name:""));promptState[key]=2}else if(m<850&&st<1){speak("In half a mile, "+action(s).toLowerCase()+(s.name?" onto "+s.name:""));promptState[key]=1}}
function nearestRouteDistanceMeters(){if(!route?.coordinates||!user)return 99999;let best=Infinity;for(let i=0;i<route.coordinates.length;i+=Math.max(1,Math.floor(route.coordinates.length/250))){let d=miles(user,route.coordinates[i])*1609.344;if(d<best)best=d}return best}
function updateNav(){if(miles(user,dest)<.04){arrive();return}let s=steps[stepIndex];if(!s)return;let m=distanceToStep(s);stagedVoice(s,m);
if(m<32&&stepIndex<steps.length-1){stepIndex++;updateTurn()}
let off=nearestRouteDistanceMeters();if(off>75&&Date.now()-lastReroute>12000){$("status").textContent="> ROUTE DEVIATION // RECALCULATING";speak("Recalculating route");calculate(false);return}
if(Date.now()-lastReroute>45000&&lastReroutePos&&miles(user,lastReroutePos)>.25)calculate(false);
updateTurn();camera()}
function arrive(){navActive=false;follow=false;$("status").textContent="> OBJECTIVE REACHED";$("turn").style.display="none";$("dist").textContent="0.0";$("eta").textContent="0M";$("toast").style.display="block";speak("Objective reached. You have arrived.");setTimeout(()=>$("toast").style.display="none",4500)}
function endNav(){navActive=false;dest=null;steps=[];route=null;$("turn").style.display="none";$("search").style.display="block";$("destination").value="";$("dist").textContent=$("eta").textContent="--";$("nav").textContent="[ TRACKING ]";if(objMarker){objMarker.remove();objMarker=null}["route-core","route-glow","route-shadow"].forEach(x=>{if(map.getLayer(x))map.removeLayer(x)});if(map.getSource("route"))map.removeSource("route");follow=true;$("status").textContent="> NAVIGATION TERMINATED // GPS ACTIVE"}
$("nav").onclick=()=>navActive?endNav():(watch===null&&startGPS());
$("center").onclick=()=>{if(!user)return;follow=true;camera();$("status").textContent=navActive?"> NAVIGATION ACTIVE // FOLLOW MODE":"> POSITION TRACKING ACTIVE"};
$("voice").onclick=()=>{
 if(!voiceOn){testVoice();return}
 if(!voiceUnlocked){testVoice();return}
 voiceOn=false;$("voice").textContent="[ VOICE OFF ]";$("status").textContent="> VOICE GUIDANCE MUTED";if("speechSynthesis" in window)speechSynthesis.cancel();
};
$("destination").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();let q=e.target.value.trim();if(q){e.target.blur();search(q)}}});
map.on("dragstart",()=>{follow=false;$("status").textContent="> FREE MAP MODE // PRESS RECENTER"});
</script>
</body>
</html>
