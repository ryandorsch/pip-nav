<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">

<meta name="theme-color" content="#001006">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">

<title>PIP-NAV V0.4.1</title>

<link
href="https://unpkg.com/maplibre-gl@5.7.1/dist/maplibre-gl.css"
rel="stylesheet">

<style>

:root{
  --green:#39ff72;
  --bright:#7dff9e;
  --mid:#24bd55;
  --dim:#117532;
  --dark:#001006;
  --panel:rgba(0,13,5,.94);
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:var(--dark);
  color:var(--green);
  font-family:"Courier New",monospace;
}

/* =========================
   MAP
========================= */

#map{
  position:absolute;
  inset:0;
  background:#001006;

  filter:
    saturate(1.35)
    brightness(.72)
    contrast(1.35);
}

/* subtle darkening only */

#mapShade{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:4;

  background:
    radial-gradient(
      circle at center,
      transparent 25%,
      rgba(0,12,4,.12) 100%
    );
}

/* phosphor glow */

#phosphor{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:5;

  background:
    radial-gradient(
      circle at center,
      rgba(57,255,114,.025),
      rgba(0,30,8,.07)
    );
}

/* CRT scanlines */

#scanlines{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:40;

  opacity:.38;

  background:
    repeating-linear-gradient(
      0deg,
      rgba(0,0,0,.16),
      rgba(0,0,0,.16) 1px,
      transparent 1px,
      transparent 4px
    );
}

/* CRT vignette */

#vignette{
  position:fixed;
  inset:0;
  z-index:39;
  pointer-events:none;

  box-shadow:
    inset 0 0 75px rgba(0,0,0,.55);
}


/* =========================
   HEADER
========================= */

#header{
  position:fixed;
  top:0;
  left:0;
  right:0;
  z-index:20;

  padding:
    calc(10px + env(safe-area-inset-top))
    14px
    9px;

  background:var(--panel);

  border-bottom:
    2px solid var(--green);

  box-shadow:
    0 0 15px rgba(57,255,114,.20);
}

#headerTop{
  display:flex;
  align-items:center;
  justify-content:space-between;
}

#title{
  font-size:25px;
  font-weight:bold;
  letter-spacing:4px;

  text-shadow:
    0 0 9px var(--green);
}

#headerRight{
  display:flex;
  gap:14px;
  align-items:center;
  font-size:10px;
}

#gpsIndicator{
  text-shadow:
    0 0 7px var(--green);
}

#version{
  opacity:.55;
}

#subtitle{
  margin-top:3px;
  font-size:8px;
  letter-spacing:1.2px;
  opacity:.62;
}


/* =========================
   SEARCH
========================= */

#searchPanel{
  position:fixed;
  z-index:20;

  top:
    calc(82px + env(safe-area-inset-top));

  left:12px;
  right:12px;

  padding:10px 12px;

  background:var(--panel);

  border:
    1px solid var(--green);

  box-shadow:
    0 0 12px rgba(57,255,114,.18);
}

#searchLabel{
  font-size:8px;
  opacity:.6;
  margin-bottom:6px;
}

#destination{
  width:100%;
  border:0;
  outline:0;
  background:transparent;

  color:var(--bright);

  font-family:"Courier New",monospace;
  font-size:15px;

  text-shadow:
    0 0 6px var(--green);
}

#destination::placeholder{
  color:var(--dim);
}


/* =========================
   TURN PANEL
========================= */

#turnPanel{
  display:none;

  position:fixed;
  z-index:20;

  top:
    calc(82px + env(safe-area-inset-top));

  left:10px;
  right:10px;

  min-height:108px;

  padding:12px;

  background:var(--panel);

  border:
    2px solid var(--green);

  box-shadow:
    0 0 14px rgba(57,255,114,.25);
}

#turnGrid{
  display:grid;
  grid-template-columns:72px 1fr;
  gap:10px;
  align-items:center;
}

#turnArrow{
  font-size:60px;
  line-height:60px;
  text-align:center;
  font-family:Arial,sans-serif;

  filter:
    drop-shadow(0 0 8px var(--green));
}

#turnInstruction{
  font-size:19px;
  font-weight:bold;

  text-shadow:
    0 0 7px var(--green);
}

#turnStreet{
  margin-top:6px;
  font-size:12px;
  color:var(--bright);
}

#thenInstruction{
  margin-top:6px;
  font-size:8px;
  opacity:.65;
}


/* =========================
   COMPASS
========================= */

#compass{
  display:none;

  position:fixed;
  z-index:18;

  top:
    calc(202px + env(safe-area-inset-top));

  left:12px;

  width:54px;
  height:64px;

  text-align:center;

  background:
    rgba(0,13,5,.92);

  border:
    1px solid var(--green);

  padding-top:5px;

  box-shadow:
    0 0 8px rgba(57,255,114,.18);
}

#compassLetter{
  font-size:10px;
  font-weight:bold;
}

#compassArrow{
  font-size:27px;
  line-height:29px;

  transform-origin:center;

  text-shadow:
    0 0 7px var(--green);
}


/* =========================
   HUD
========================= */

#hud{
  position:fixed;
  z-index:20;

  bottom:
    calc(60px + env(safe-area-inset-bottom));

  left:8px;
  right:8px;

  background:var(--panel);

  border:
    1px solid var(--green);

  box-shadow:
    0 0 13px rgba(57,255,114,.20);
}

#status{
  padding:7px 9px;

  border-bottom:
    1px solid var(--dim);

  font-size:9px;

  text-shadow:
    0 0 5px var(--green);
}

#stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  text-align:center;
}

.stat{
  padding:8px 3px;

  border-right:
    1px solid var(--dim);
}

.stat:last-child{
  border-right:0;
}

.statLabel{
  font-size:7px;
  opacity:.55;
}

.statValue{
  margin-top:2px;

  font-size:17px;
  font-weight:bold;

  text-shadow:
    0 0 7px var(--green);
}

.statUnit{
  margin-top:1px;
  font-size:7px;
  opacity:.65;
}

#controls{
  display:grid;
  grid-template-columns:repeat(3,1fr);

  border-top:
    1px solid var(--dim);
}

.ctrl{
  min-height:38px;

  border:0;

  border-right:
    1px solid var(--dim);

  background:transparent;

  color:var(--green);

  font-family:"Courier New",monospace;

  font-size:9px;
  font-weight:bold;
}

.ctrl:last-child{
  border-right:0;
}


/* =========================
   BOTTOM NAV
========================= */

#bottomNav{
  position:fixed;

  z-index:20;

  bottom:0;
  left:0;
  right:0;

  height:
    calc(52px + env(safe-area-inset-bottom));

  padding-top:11px;

  display:flex;
  justify-content:space-around;

  background:#010803;

  border-top:
    2px solid var(--green);
}

.navItem{
  font-size:9px;
  opacity:.48;
}

.navItem.active{
  opacity:1;

  border-bottom:
    2px solid var(--green);
}


/* =========================
   PLAYER
========================= */

.playerWrap{
  width:48px;
  height:48px;

  border:
    2px solid rgba(57,255,114,.45);

  border-radius:50%;

  display:flex;
  justify-content:center;
  align-items:center;

  background:
    rgba(0,16,6,.35);

  box-shadow:
    0 0 8px rgba(57,255,114,.8),
    0 0 18px rgba(57,255,114,.45),
    inset 0 0 12px rgba(57,255,114,.25);
}

.playerArrow{
  width:0;
  height:0;

  border-left:
    10px solid transparent;

  border-right:
    10px solid transparent;

  border-bottom:
    29px solid var(--bright);

  filter:
    drop-shadow(0 0 5px var(--green));

  transform-origin:center center;
}


/* =========================
   OBJECTIVE
========================= */

.objective{
  width:30px;
  height:30px;

  position:relative;

  border:
    2px solid var(--green);

  transform:rotate(45deg);

  box-shadow:
    0 0 12px var(--green);

  background:
    rgba(1,12,4,.82);
}

.objective:after{
  content:"";

  position:absolute;

  width:8px;
  height:8px;

  top:9px;
  left:9px;

  background:var(--green);

  box-shadow:
    0 0 8px var(--green);
}


/* =========================
   ARRIVAL
========================= */

#arrival{
  display:none;

  position:fixed;
  z-index:50;

  top:50%;
  left:50%;

  transform:
    translate(-50%,-50%);

  width:85%;

  padding:25px 15px;

  text-align:center;

  background:#010803;

  border:
    3px solid var(--green);

  box-shadow:
    0 0 30px rgba(57,255,114,.45);

  text-shadow:
    0 0 9px var(--green);
}

#arrivalTitle{
  font-size:23px;
  font-weight:bold;
}

#arrivalSub{
  margin-top:10px;
  font-size:11px;
}


/* hide stock MapLibre controls */

.maplibregl-control-container{
  display:none;
}

</style>
</head>

<script>

/* =========================================
   PIP-NAV V0.4.1
========================================= */

const statusEl =
document.getElementById("status");

const speedEl =
document.getElementById("speed");

const distanceEl =
document.getElementById("distance");

const etaEl =
document.getElementById("eta");

const headingEl =
document.getElementById("heading");

const headingDirectionEl =
document.getElementById("headingDirection");

const gpsEl =
document.getElementById("gpsIndicator");

const destinationInput =
document.getElementById("destination");

const searchPanel =
document.getElementById("searchPanel");

const turnPanel =
document.getElementById("turnPanel");

const turnArrow =
document.getElementById("turnArrow");

const turnInstruction =
document.getElementById("turnInstruction");

const turnStreet =
document.getElementById("turnStreet");

const thenInstruction =
document.getElementById("thenInstruction");

const compass =
document.getElementById("compass");

const compassArrow =
document.getElementById("compassArrow");

const compassLetter =
document.getElementById("compassLetter");

const navButton =
document.getElementById("navButton");

const voiceButton =
document.getElementById("voiceButton");

const arrivalPanel =
document.getElementById("arrival");


let userPosition = null;
let playerMarker = null;
let objectiveMarker = null;
let watchID = null;

let navigationActive = false;
let followMode = false;
let voiceEnabled = true;

let destinationPosition = null;
let destinationName = "";

let routeSteps = [];
let routeGeometry = null;

let lastRouteTime = 0;
let lastSpokenStep = -1;
let currentStepIndex = 0;

let lastPosition = null;
let lastReroutePosition = null;


/* =========================================
   MAP
========================================= */

const map =
new maplibregl.Map({

  container:"map",

  style:
  "https://demotiles.maplibre.org/style.json",

  center:[
    -74.25,
    40.4
  ],

  zoom:9,

  attributionControl:false

});


map.on("load",()=>{

  statusEl.innerHTML =
  "> MAP DATABASE ONLINE // GPS STANDBY";

  buildPipBoyMap();

});


/* =========================================
   PIP-BOY MAP STYLE
========================================= */

function buildPipBoyMap(){

  const style =
  map.getStyle();

  if(
    !style ||
    !style.layers
  ){

    return;

  }


  style.layers.forEach(layer=>{

    const id =
    layer.id.toLowerCase();


    /* BACKGROUND */

    if(
      layer.type ===
      "background"
    ){

      try{

        map.setPaintProperty(
          layer.id,
          "background-color",
          "#001006"
        );

      }catch(e){}

      return;

    }


    /* WATER */

    if(
      id.includes("water") &&
      layer.type === "fill"
    ){

      try{

        map.setPaintProperty(
          layer.id,
          "fill-color",
          "#000704"
        );

        map.setPaintProperty(
          layer.id,
          "fill-opacity",
          1
        );

      }catch(e){}

      return;

    }


    /* LAND */

    if(
      layer.type === "fill" &&
      (
        id.includes("land") ||
        id.includes("park") ||
        id.includes("earth") ||
        id.includes("landcover") ||
        id.includes("landuse")
      )
    ){

      try{

        map.setPaintProperty(
          layer.id,
          "fill-color",
          "#001408"
        );

        map.setPaintProperty(
          layer.id,
          "fill-opacity",
          .72
        );

      }catch(e){}

      return;

    }


    /* ROADS */

    if(
      layer.type === "line" &&
      (
        id.includes("road") ||
        id.includes("street") ||
        id.includes("highway") ||
        id.includes("motorway") ||
        id.includes("transport")
      )
    ){

      try{

        let roadColor =
        "#168b3b";

        let opacity =
        .82;


        if(
          id.includes("motorway") ||
          id.includes("highway") ||
          id.includes("trunk")
        ){

          roadColor =
          "#2bd85f";

          opacity =
          .95;

        }


        map.setPaintProperty(
          layer.id,
          "line-color",
          roadColor
        );

        map.setPaintProperty(
          layer.id,
          "line-opacity",
          opacity
        );

      }catch(e){}

      return;

    }


    /* BOUNDARIES */

    if(
      layer.type === "line" &&
      id.includes("boundary")
    ){

      try{

        map.setPaintProperty(
          layer.id,
          "line-color",
          "#0b5d2a"
        );

        map.setPaintProperty(
          layer.id,
          "line-opacity",
          .45
        );

      }catch(e){}

    }


    /* LABELS */

    if(
      layer.type ===
      "symbol"
    ){

      try{

        map.setPaintProperty(
          layer.id,
          "text-color",
          "#62ff91"
        );

        map.setPaintProperty(
          layer.id,
          "text-halo-color",
          "#001006"
        );

        map.setPaintProperty(
          layer.id,
          "text-halo-width",
          2
        );

        map.setPaintProperty(
          layer.id,
          "text-opacity",
          .90
        );

      }catch(e){}


      try{

        map.setPaintProperty(
          layer.id,
          "icon-opacity",
          .72
        );

      }catch(e){}

    }

  });

}


/* =========================================
   PLAYER MARKER
========================================= */

function createPlayerMarker(){

  const wrap =
  document.createElement("div");

  wrap.className =
  "playerWrap";


  const arrow =
  document.createElement("div");

  arrow.className =
  "playerArrow";


  wrap.appendChild(
    arrow
  );


  playerMarker =
  new maplibregl.Marker({

    element:wrap,

    anchor:"center"

  });

}


/* =========================================
   OBJECTIVE MARKER
========================================= */

function createObjectiveMarker(
  position
){

  if(objectiveMarker){

    objectiveMarker.remove();

  }


  const element =
  document.createElement("div");

  element.className =
  "objective";


  objectiveMarker =
  new maplibregl.Marker({

    element:element,

    anchor:"center"

  })

  .setLngLat(
    position
  )

  .addTo(map);

}


/* =========================================
   DISTANCE
========================================= */

function haversineMiles(
  a,
  b
){

  const R =
  3958.8;


  const lat1 =
  a[1] *
  Math.PI / 180;


  const lat2 =
  b[1] *
  Math.PI / 180;


  const dLat =
  (b[1]-a[1]) *
  Math.PI / 180;


  const dLon =
  (b[0]-a[0]) *
  Math.PI / 180;


  const x =

  Math.sin(dLat/2) *
  Math.sin(dLat/2) +

  Math.cos(lat1) *
  Math.cos(lat2) *

  Math.sin(dLon/2) *
  Math.sin(dLon/2);


  return R *
  2 *
  Math.atan2(
    Math.sqrt(x),
    Math.sqrt(1-x)
  );

}


/* =========================================
   HEADING
========================================= */

function headingLetter(
  degrees
){

  if(
    degrees === null ||
    degrees === undefined
  ){

    return "--";

  }


  const directions = [

    "N",
    "NE",
    "E",
    "SE",
    "S",
    "SW",
    "W",
    "NW"

  ];


  return directions[

    Math.round(
      degrees / 45
    ) % 8

  ];

}


/* =========================================
   GPS
========================================= */

function updatePosition(
  position
){

  const c =
  position.coords;


  userPosition = [

    c.longitude,

    c.latitude

  ];


  /* PLAYER */


  if(!playerMarker){

    createPlayerMarker();


    playerMarker

    .setLngLat(
      userPosition
    )

    .addTo(map);

  }

  else{

    playerMarker
    .setLngLat(
      userPosition
    );

  }


  /* SPEED */


  if(
    c.speed !== null &&
    c.speed >= 0
  ){

    speedEl.innerHTML =
    Math.round(
      c.speed *
      2.23694
    );

  }

  else{

    speedEl.innerHTML =
    "0";

  }


  /* HEADING */


  if(
    c.heading !== null &&
    !isNaN(c.heading)
  ){

    const hdg =
    Math.round(
      c.heading
    );


    headingDirectionEl
    .innerHTML =
    headingLetter(
      hdg
    );


    headingEl.innerHTML =
    hdg + "°";


    compassLetter.innerHTML =
    headingLetter(
      hdg
    );


    compassArrow.style.transform =
    "rotate(" +
    hdg +
    "deg)";


    const arrow =
    document.querySelector(
      ".playerArrow"
    );


    if(arrow){

      arrow.style.transform =
      "rotate(" +
      hdg +
      "deg)";

    }

  }


  gpsEl.innerHTML =
  "GPS ●";


  /* FOLLOW */


  if(followMode){

    let bearing = 0;


    if(
      c.heading !== null &&
      !isNaN(c.heading)
    ){

      bearing =
      c.heading;

    }


    map.easeTo({

      center:
      userPosition,

      zoom:
      navigationActive
      ? 16
      : 15,

      bearing:
      navigationActive
      ? bearing
      : 0,

      pitch:
      navigationActive
      ? 25
      : 0,

      duration:
      650

    });

  }


  if(navigationActive){

    updateNavigation();

  }

  else{

    statusEl.innerHTML =
    "> POSITION TRACKING ACTIVE";

  }


  lastPosition =
  userPosition;

}


/* =========================================
   GPS ERROR
========================================= */

function gpsError(
  error
){

  gpsEl.innerHTML =
  "GPS ×";


  statusEl.innerHTML =
  "> GPS ERROR // " +
  error.message;

}


/* =========================================
   START GPS
========================================= */

function startGPS(){

  if(
    !navigator.geolocation
  ){

    statusEl.innerHTML =
    "> GPS HARDWARE UNAVAILABLE";

    return;

  }


  statusEl.innerHTML =
  "> ACQUIRING SATELLITE SIGNAL...";


  followMode =
  true;


  watchID =
  navigator.geolocation
  .watchPosition(

    updatePosition,

    gpsError,

    {

      enableHighAccuracy:
      true,

      maximumAge:
      500,

      timeout:
      15000

    }

  );


  navButton.innerHTML =
  "[ TRACKING ]";

}


/* =========================================
   DESTINATION SEARCH
========================================= */

async function searchDestination(
  query
){

  if(!userPosition){

    statusEl.innerHTML =
    "> ACQUIRE GPS BEFORE NAVIGATION";

    return;

  }


  statusEl.innerHTML =
  "> SEARCHING WASTELAND DATABASE...";


  try{


    const url =

    "https://nominatim.openstreetmap.org/search" +

    "?format=json" +

    "&limit=1" +

    "&q=" +

    encodeURIComponent(
      query
    );


    const response =
    await fetch(
      url
    );


    if(!response.ok){

      throw new Error(
        "SEARCH FAILURE"
      );

    }


    const results =
    await response.json();


    if(!results.length){

      statusEl.innerHTML =
      "> DESTINATION NOT FOUND";

      return;

    }


    destinationPosition = [

      parseFloat(
        results[0].lon
      ),

      parseFloat(
        results[0].lat
      )

    ];


    destinationName =
    results[0].display_name;


    createObjectiveMarker(
      destinationPosition
    );


    statusEl.innerHTML =
    "> OBJECTIVE LOCKED // CALCULATING ROUTE";


    await calculateRoute(
      true
    );

  }

  catch(error){

    console.error(
      error
    );


    statusEl.innerHTML =
    "> DATABASE CONNECTION ERROR";

  }

}


/* =========================================
   ROUTING
========================================= */

async function calculateRoute(
  initial=false
){

  if(
    !userPosition ||
    !destinationPosition
  ){

    return;

  }


  const url =

  "https://router.project-osrm.org/route/v1/driving/" +

  userPosition[0] +
  "," +
  userPosition[1] +

  ";" +

  destinationPosition[0] +
  "," +
  destinationPosition[1] +

  "?overview=full" +

  "&geometries=geojson" +

  "&steps=true";


  try{


    const response =
    await fetch(
      url
    );


    if(!response.ok){

      throw new Error(
        "ROUTE FAILURE"
      );

    }


    const data =
    await response.json();


    if(
      !data.routes ||
      !data.routes.length
    ){

      statusEl.innerHTML =
      "> ROUTE UNAVAILABLE";

      return;

    }


    const route =
    data.routes[0];


    routeGeometry =
    route.geometry;


    routeSteps =
    route.legs[0].steps;


    currentStepIndex =
    0;


    lastSpokenStep =
    -1;


    updateTripStats(

      route.distance,

      route.duration

    );


    drawRoute(
      route.geometry
    );


    navigationActive =
    true;


    followMode =
    !initial;


    searchPanel.style.display =
    "none";


    turnPanel.style.display =
    "block";


    compass.style.display =
    "block";


    navButton.innerHTML =
    "[ END NAV ]";


    statusEl.innerHTML =
    "> NAVIGATION ACTIVE // FOLLOWING ROUTE";


    lastRouteTime =
    Date.now();


    lastReroutePosition = [

      userPosition[0],

      userPosition[1]

    ];


    updateTurnPanel();


    if(initial){

      showFullRoute(
        route.geometry
      );

    }

    else{

      followMode =
      true;

    }

  }

  catch(error){

    console.error(
      error
    );


    statusEl.innerHTML =
    "> ROUTING COMPUTER ERROR";

  }

}


/* =========================================
   ROUTE DRAWING
========================================= */

function drawRoute(
  geometry
){

  if(
    map.getLayer(
      "route-core"
    )
  ){

    map.removeLayer(
      "route-core"
    );

  }


  if(
    map.getLayer(
      "route-glow"
    )
  ){

    map.removeLayer(
      "route-glow"
    );

  }


  if(
    map.getLayer(
      "route-shadow"
    )
  ){

    map.removeLayer(
      "route-shadow"
    );

  }


  if(
    map.getSource(
      "route"
    )
  ){

    map.removeSource(
      "route"
    );

  }


  map.addSource(

    "route",

    {

      type:"geojson",

      data:{

        type:"Feature",

        properties:{},

        geometry:
        geometry

      }

    }

  );


  /* BLACK SEPARATION */

  map.addLayer({

    id:
    "route-shadow",

    type:
    "line",

    source:
    "route",

    layout:{

      "line-join":
      "round",

      "line-cap":
      "round"

    },

    paint:{

      "line-color":
      "#001006",

      "line-width":
      16,

      "line-opacity":
      1

    }

  });


  /* PHOSPHOR GLOW */

  map.addLayer({

    id:
    "route-glow",

    type:
    "line",

    source:
    "route",

    layout:{

      "line-join":
      "round",

      "line-cap":
      "round"

    },

    paint:{

      "line-color":
      "#39ff72",

      "line-width":
      14,

      "line-opacity":
      .35,

      "line-blur":
      6

    }

  });


  /* ROUTE CORE */

  map.addLayer({

    id:
    "route-core",

    type:
    "line",

    source:
    "route",

    layout:{

      "line-join":
      "round",

      "line-cap":
      "round"

    },

    paint:{

      "line-color":
      "#67ff8f",

      "line-width":
      6,

      "line-opacity":
      1

    }

  });

}


/* =========================================
   FULL ROUTE VIEW
========================================= */

function showFullRoute(
  geometry
){

  const bounds =
  new maplibregl
  .LngLatBounds();


  geometry.coordinates
  .forEach(coord=>{

    bounds.extend(
      coord
    );

  });


  map.fitBounds(

    bounds,

    {

      padding:{

        top:
        225,

        bottom:
        205,

        left:
        35,

        right:
        35

      },

      duration:
      1100

    }

  );

}


/* =========================================
   TRIP STATS
========================================= */

function updateTripStats(
  meters,
  seconds
){

  const miles =
  meters /
  1609.344;


  distanceEl.innerHTML =
  miles.toFixed(1);


  const mins =
  Math.max(

    1,

    Math.round(
      seconds / 60
    )

  );


  if(mins >= 60){

    etaEl.innerHTML =

    Math.floor(
      mins / 60
    ) +

    "H" +

    String(
      mins % 60
    )
    .padStart(
      2,
      "0"
    );

  }

  else{

    etaEl.innerHTML =
    mins +
    "M";

  }

}


/* =========================================
   TURN SYMBOL
========================================= */

function maneuverSymbol(
  step
){

  if(
    !step ||
    !step.maneuver
  ){

    return "↑";

  }


  const modifier =
  step.maneuver.modifier ||
  "";


  if(
    modifier.includes(
      "right"
    )
  ){

    return "↱";

  }


  if(
    modifier.includes(
      "left"
    )
  ){

    return "↰";

  }


  if(
    modifier.includes(
      "uturn"
    )
  ){

    return "↶";

  }


  return "↑";

}


/* =========================================
   HUMAN DISTANCE
========================================= */

function humanDistance(
  meters
){

  const miles =
  meters /
  1609.344;


  if(miles >= .1){

    return miles.toFixed(1) +
    " MI";

  }


  const feet =
  meters *
  3.28084;


  return Math.max(

    50,

    Math.round(
      feet / 50
    ) * 50

  ) + " FT";

}


/* =========================================
   TURN PANEL
========================================= */

function updateTurnPanel(){

  if(
    !routeSteps.length
  ){

    return;

  }


  const step =
  routeSteps[
    currentStepIndex
  ];


  if(!step){

    return;

  }


  turnArrow.innerHTML =
  maneuverSymbol(
    step
  );


  let type =
  step.maneuver.type ||
  "continue";


  let modifier =
  step.maneuver.modifier ||
  "";


  let action =
  "CONTINUE";


  if(
    type === "turn"
  ){

    action =
    "TURN " +
    modifier.toUpperCase();

  }

  else if(
    type === "roundabout"
  ){

    action =
    "ENTER ROUNDABOUT";

  }

  else if(
    type === "merge"
  ){

    action =
    "MERGE " +
    modifier.toUpperCase();

  }

  else if(
    type === "fork"
  ){

    action =
    "KEEP " +
    modifier.toUpperCase();

  }

  else if(
    type === "arrive"
  ){

    action =
    "DESTINATION";

  }


  turnInstruction.innerHTML =

  action +

  " IN " +

  humanDistance(
    distanceToStep(
      step
    )
  );


  turnStreet.innerHTML =

  step.name

  ? step.name

  : "UNNAMED ROAD";


  const next =
  routeSteps[
    currentStepIndex + 1
  ];


  if(next){

    const nextAction =

    next.maneuver &&
    next.maneuver.modifier

    ? next.maneuver.modifier
      .toUpperCase()

    : "STRAIGHT";


    thenInstruction.innerHTML =

    "THEN: " +

    nextAction +

    (
      next.name

      ? " ON " +
        next.name

      : ""
    );

  }

  else{

    thenInstruction.innerHTML =
    "OBJECTIVE APPROACHING";

  }

}


/* =========================================
   DISTANCE TO STEP
========================================= */

function distanceToStep(
  step
){

  if(
    !step ||
    !step.maneuver ||
    !step.maneuver.location ||
    !userPosition
  ){

    return 0;

  }


  return haversineMiles(

    userPosition,

    step.maneuver.location

  ) * 1609.344;

}


/* =========================================
   SPEECH
========================================= */

function speak(
  text
){

  if(!voiceEnabled){

    return;

  }


  if(
    !(
      "speechSynthesis"
      in window
    )
  ){

    return;

  }


  window
  .speechSynthesis
  .cancel();


  const utterance =
  new SpeechSynthesisUtterance(
    text
  );


  utterance.rate =
  1.05;


  window
  .speechSynthesis
  .speak(
    utterance
  );

}


/* =========================================
   LIVE NAVIGATION
========================================= */

function updateNavigation(){

  if(
    !destinationPosition ||
    !routeSteps.length
  ){

    return;

  }


  const destinationDistance =
  haversineMiles(

    userPosition,

    destinationPosition

  );


  /* ARRIVAL */

  if(
    destinationDistance <
    .04
  ){

    arrive();

    return;

  }


  const step =
  routeSteps[
    currentStepIndex
  ];


  if(step){

    const meters =
    distanceToStep(
      step
    );


    if(
      meters < 35 &&
      currentStepIndex <
      routeSteps.length - 1
    ){

      currentStepIndex++;

      updateTurnPanel();

    }


    if(
      meters < 322 &&
      lastSpokenStep !==
      currentStepIndex
    ){

      const current =
      routeSteps[
        currentStepIndex
      ];


      const instruction =

      (
        current.maneuver &&
        current.maneuver.modifier

        ? current.maneuver.modifier

        : "straight"
      ) +

      (
        current.name

        ? " onto " +
          current.name

        : ""
      );


      speak(

        "In " +

        humanDistance(
          meters
        ) +

        ", " +

        instruction

      );


      lastSpokenStep =
      currentStepIndex;

    }

  }


  updateTurnPanel();


  /* PERIODIC ROUTE REFRESH */

  const now =
  Date.now();


  const movedSinceReroute =

  lastReroutePosition

  ? haversineMiles(

      userPosition,

      lastReroutePosition

    )

  : 1;


  if(
    now - lastRouteTime >
    30000 &&
    movedSinceReroute >
    .08
  ){

    calculateRoute(
      false
    );

  }

}


/* =========================================
   ARRIVAL
========================================= */

function arrive(){

  navigationActive =
  false;


  followMode =
  false;


  statusEl.innerHTML =
  "> OBJECTIVE REACHED";


  turnPanel.style.display =
  "none";


  compass.style.display =
  "none";


  arrivalPanel.style.display =
  "block";


  distanceEl.innerHTML =
  "0.0";


  etaEl.innerHTML =
  "0M";


  speak(
    "Objective reached. You have arrived."
  );


  setTimeout(()=>{

    arrivalPanel.style.display =
    "none";

  },5000);

}


/* =========================================
   END NAVIGATION
========================================= */

function endNavigation(){

  navigationActive =
  false;


  destinationPosition =
  null;


  destinationName =
  "";


  routeSteps =
  [];


  routeGeometry =
  null;


  turnPanel.style.display =
  "none";


  compass.style.display =
  "none";


  searchPanel.style.display =
  "block";


  destinationInput.value =
  "";


  distanceEl.innerHTML =
  "--";


  etaEl.innerHTML =
  "--";


  navButton.innerHTML =
  "[ TRACKING ]";


  if(objectiveMarker){

    objectiveMarker.remove();

    objectiveMarker =
    null;

  }


  if(
    map.getLayer(
      "route-core"
    )
  ){

    map.removeLayer(
      "route-core"
    );

  }


  if(
    map.getLayer(
      "route-glow"
    )
  ){

    map.removeLayer(
      "route-glow"
    );

  }


  if(
    map.getLayer(
      "route-shadow"
    )
  ){

    map.removeLayer(
      "route-shadow"
    );

  }


  if(
    map.getSource(
      "route"
    )
  ){

    map.removeSource(
      "route"
    );

  }


  statusEl.innerHTML =
  "> NAVIGATION TERMINATED // GPS ACTIVE";


  followMode =
  true;


  if(userPosition){

    map.easeTo({

      center:
      userPosition,

      zoom:
      15,

      bearing:
      0,

      pitch:
      0,

      duration:
      700

    });

  }

}


/* =========================================
   BUTTONS
========================================= */

navButton.onclick =
()=>{

  if(navigationActive){

    endNavigation();

    return;

  }


  if(
    watchID === null
  ){

    startGPS();

  }

};


document
.getElementById(
  "centerButton"
)
.onclick =
()=>{

  if(!userPosition){

    return;

  }


  followMode =
  true;


  statusEl.innerHTML =

  navigationActive

  ? "> NAVIGATION ACTIVE // FOLLOW MODE"

  : "> POSITION TRACKING ACTIVE";


  map.easeTo({

    center:
    userPosition,

    zoom:
    navigationActive
    ? 16
    : 15,

    duration:
    600

  });

};


/* VOICE */

voiceButton.onclick =
()=>{

  voiceEnabled =
  !voiceEnabled;


  voiceButton.innerHTML =

  voiceEnabled

  ? "[ VOICE ON ]"

  : "[ VOICE OFF ]";


  if(
    !voiceEnabled &&
    "speechSynthesis"
    in window
  ){

    window
    .speechSynthesis
    .cancel();

  }

};


/* =========================================
   SEARCH ENTER
========================================= */

destinationInput
.addEventListener(

  "keydown",

  event=>{

    if(
      event.key !==
      "Enter"
    ){

      return;

    }


    event.preventDefault();


    const query =
    destinationInput
    .value
    .trim();


    if(!query){

      return;

    }


    destinationInput.blur();


    searchDestination(
      query
    );

  }

);


/* =========================================
   FREE MAP MODE
========================================= */

map.on(
  "dragstart",
  ()=>{

    followMode =
    false;


    statusEl.innerHTML =
    "> FREE MAP MODE // PRESS RECENTER";

  }
);

</script>
