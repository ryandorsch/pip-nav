<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
 content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">

<meta name="theme-color" content="#020a03">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>PIP-NAV</title>

<link
 href="https://unpkg.com/maplibre-gl@5.7.1/dist/maplibre-gl.css"
 rel="stylesheet">

<style>

:root {
 --green:#39ff72;
 --dim:#178b3c;
 --dark:#020a03;
 --panel:rgba(2,16,5,.90);
}

* {
 box-sizing:border-box;
}

html,body {
 margin:0;
 width:100%;
 height:100%;
 overflow:hidden;
 background:var(--dark);
 font-family:"Courier New",monospace;
 color:var(--green);
}

#map {
 position:absolute;
 inset:0;
 filter:
   grayscale(1)
   sepia(1)
   hue-rotate(75deg)
   saturate(7)
   brightness(.40)
   contrast(1.6);
}

/* green CRT tint */

#phosphor {
 position:fixed;
 inset:0;
 pointer-events:none;
 z-index:5;
 background:rgba(0,255,65,.035);
}

/* scanlines */

#scanlines {
 position:fixed;
 inset:0;
 pointer-events:none;
 z-index:30;

 background:
 repeating-linear-gradient(
  0deg,
  rgba(0,0,0,.15),
  rgba(0,0,0,.15) 1px,
  transparent 1px,
  transparent 4px
 );
}

/* HEADER */

#header {
 position:fixed;
 top:0;
 left:0;
 right:0;
 z-index:20;

 padding:
 calc(12px + env(safe-area-inset-top))
 15px 10px;

 background:var(--panel);

 border-bottom:2px solid var(--green);

 box-shadow:
 0 0 15px rgba(57,255,114,.18);

 text-shadow:
 0 0 8px var(--green);
}

#topline {
 display:flex;
 justify-content:space-between;
 align-items:center;
}

#title {
 font-size:21px;
 font-weight:bold;
 letter-spacing:3px;
}

#gpsIndicator {
 font-size:11px;
}

#sub {
 margin-top:3px;
 font-size:9px;
 opacity:.7;
 letter-spacing:1px;
}

/* SEARCH */

#search {
 position:fixed;
 z-index:20;

 top:calc(85px + env(safe-area-inset-top));
 left:12px;
 right:12px;

 background:var(--panel);
 border:1px solid var(--green);

 padding:10px;

 box-shadow:0 0 10px rgba(57,255,114,.15);
}

#searchLabel {
 font-size:9px;
 margin-bottom:5px;
 opacity:.7;
}

#destination {
 width:100%;
 border:none;
 outline:none;

 color:var(--green);
 background:transparent;

 font-family:"Courier New",monospace;
 font-size:14px;

 text-shadow:0 0 5px var(--green);
}

#destination::placeholder {
 color:var(--dim);
}

/* STATUS PANEL */

#hud {
 position:fixed;
 z-index:20;

 bottom:calc(68px + env(safe-area-inset-bottom));
 left:10px;
 right:10px;

 background:var(--panel);
 border:1px solid var(--green);

 box-shadow:
 0 0 12px rgba(57,255,114,.2),
 inset 0 0 15px rgba(57,255,114,.04);
}

#status {
 padding:8px 10px;

 font-size:10px;

 border-bottom:1px solid var(--dim);

 text-shadow:0 0 5px var(--green);
}

#stats {
 display:grid;
 grid-template-columns:repeat(3,1fr);

 text-align:center;

 padding:8px 0;
}

.statLabel {
 font-size:8px;
 opacity:.6;
}

.statValue {
 margin-top:2px;
 font-size:18px;
 font-weight:bold;

 text-shadow:0 0 7px var(--green);
}

/* BUTTONS */

#controls {
 display:flex;
 border-top:1px solid var(--dim);
}

.ctrl {
 flex:1;

 padding:8px;

 border:none;
 border-right:1px solid var(--dim);

 background:transparent;
 color:var(--green);

 font-family:"Courier New",monospace;
 font-weight:bold;
 font-size:10px;
}

.ctrl:last-child {
 border-right:none;
}

/* NAVIGATION */

#nav {
 position:fixed;
 z-index:20;

 bottom:0;
 left:0;
 right:0;

 height:calc(58px + env(safe-area-inset-bottom));

 display:flex;
 justify-content:space-around;

 padding-top:13px;

 background:#020a03;

 border-top:2px solid var(--green);

 text-shadow:0 0 6px var(--green);
}

.navItem {
 font-size:11px;
 opacity:.55;
}

.navItem.active {
 opacity:1;
 border-bottom:2px solid var(--green);
}

/* PLAYER */

.player {
 width:0;
 height:0;

 border-left:10px solid transparent;
 border-right:10px solid transparent;
 border-bottom:25px solid var(--green);

 filter:drop-shadow(0 0 6px var(--green));

 transform-origin:center;
}

/* hide normal controls */

.maplibregl-control-container {
 display:none;
}

</style>
</head>

<body>

<div id="map"></div>

<div id="phosphor"></div>
<div id="scanlines"></div>

<div id="header">

 <div id="topline">

  <div id="title">
   PIP-NAV
  </div>

  <div id="gpsIndicator">
   GPS ○
  </div>

 </div>

 <div id="sub">
  ROBCO INDUSTRIES // MOBILE NAVIGATION TERMINAL
 </div>

</div>

<div id="search">

 <div id="searchLabel">
  DESTINATION
 </div>

 <input
  id="destination"
  placeholder="> SEARCH WASTELAND..."
  autocomplete="off">

</div>

<div id="hud">

 <div id="status">
  > SYSTEM READY // GPS STANDBY
 </div>

 <div id="stats">

  <div>
   <div class="statLabel">SPD</div>
   <div class="statValue" id="speed">--</div>
  </div>

  <div>
   <div class="statLabel">HDG</div>
   <div class="statValue" id="heading">--</div>
  </div>

  <div>
   <div class="statLabel">GPS</div>
   <div class="statValue" id="accuracy">--</div>
  </div>

 </div>

 <div id="controls">

  <button class="ctrl" id="gpsBtn">
   [ ACQUIRE GPS ]
  </button>

  <button class="ctrl" id="centerBtn">
   [ CENTER ]
  </button>

 </div>

</div>

<div id="nav">

 <div class="navItem active">
  [ MAP ]
 </div>

 <div class="navItem">
  [ NAV ]
 </div>

 <div class="navItem">
  [ DATA ]
 </div>

</div>

<script
 src="https://unpkg.com/maplibre-gl@5.7.1/dist/maplibre-gl.js">
</script>

<script>

const status =
 document.getElementById("status");

const speedDisplay =
 document.getElementById("speed");

const headingDisplay =
 document.getElementById("heading");

const accuracyDisplay =
 document.getElementById("accuracy");

const gpsIndicator =
 document.getElementById("gpsIndicator");

let userPosition = null;
let marker = null;
let tracking = false;
let watchID = null;


/* MAP */

const map =
 new maplibregl.Map({

  container:"map",

  style:
   "https://demotiles.maplibre.org/style.json",

  center:[
   -74.25,
   40.4
  ],

  zoom:9,

  pitch:0,

  attributionControl:false

 });


map.on("load",()=>{

 status.innerHTML =
  "> MAP DATABASE ONLINE // GPS STANDBY";

});


/* PLAYER MARKER */

function createPlayerMarker(){

 const element =
  document.createElement("div");

 element.className =
  "player";

 marker =
  new maplibregl.Marker({
   element:element,
   anchor:"center"
  });

}


/* POSITION UPDATE */

function updatePosition(position){

 const c =
  position.coords;

 const lat =
  c.latitude;

 const lon =
  c.longitude;

 userPosition =
  [lon,lat];


 /* marker */

 if(!marker){

  createPlayerMarker();

  marker
   .setLngLat(userPosition)
   .addTo(map);

 } else {

  marker.setLngLat(userPosition);

 }


 /* speed */

 if(c.speed !== null){

  const mph =
   c.speed * 2.23694;

  speedDisplay.innerHTML =
   Math.round(mph);

 } else {

  speedDisplay.innerHTML =
   "0";

 }


 /* heading */

 if(c.heading !== null){

  headingDisplay.innerHTML =
   Math.round(c.heading) + "°";

  const player =
   document.querySelector(".player");

  if(player){

   player.style.transform =
    "rotate(" +
    c.heading +
    "deg)";

  }

 } else {

  headingDisplay.innerHTML =
   "--";

 }


 /* accuracy */

 accuracyDisplay.innerHTML =
  Math.round(c.accuracy) + "m";


 gpsIndicator.innerHTML =
  "GPS ●";


 status.innerHTML =
  "> POSITION TRACKING ACTIVE";


 /* follow user */

 if(tracking){

  map.easeTo({

   center:userPosition,

   zoom:
    Math.max(
     map.getZoom(),
     15
    ),

   duration:800

  });

 }

}


/* ERROR */

function gpsError(error){

 gpsIndicator.innerHTML =
  "GPS ×";

 status.innerHTML =
  "> GPS ERROR // " +
  error.message;

}


/* START TRACKING */

function startGPS(){

 if(!navigator.geolocation){

  status.innerHTML =
   "> GPS HARDWARE UNAVAILABLE";

  return;

 }


 status.innerHTML =
  "> ACQUIRING SATELLITE SIGNAL...";


 tracking = true;


 watchID =
  navigator.geolocation.watchPosition(

   updatePosition,

   gpsError,

   {

    enableHighAccuracy:true,

    maximumAge:1000,

    timeout:15000

   }

  );


 document.getElementById("gpsBtn")
  .innerHTML =
  "[ TRACKING ]";

}


/* GPS BUTTON */

document
 .getElementById("gpsBtn")
 .onclick =
 ()=>{

  if(watchID === null){

   startGPS();

  }

 };


/* CENTER BUTTON */

document
 .getElementById("centerBtn")
 .onclick =
 ()=>{

  if(userPosition){

   tracking = true;

   map.easeTo({

    center:userPosition,

    zoom:16,

    duration:600

   });

  }

 };


/* if user manually moves map,
   stop automatic centering */

map.on(
 "dragstart",
 ()=>{

  tracking = false;

  status.innerHTML =
   "> FREE MAP MODE // PRESS CENTER TO FOLLOW";

 }
);


/* Search intentionally disabled
   until V0.3 routing update */

document
 .getElementById("destination")
 .addEventListener(
  "keydown",
  e=>{

   if(e.key === "Enter"){

    e.preventDefault();

    status.innerHTML =
     "> DESTINATION DATABASE OFFLINE // V0.3";

    e.target.blur();

   }

  }
 );

</script>

</body>
</html>
