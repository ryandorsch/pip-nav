<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1,
viewport-fit=cover,
user-scalable=no">

<meta name="theme-color"
content="#020a03">

<meta name="apple-mobile-web-app-capable"
content="yes">

<title>PIP-NAV</title>

<link
href="https://unpkg.com/maplibre-gl@5.7.1/dist/maplibre-gl.css"
rel="stylesheet">

<style>

:root{
--green:#39ff72;
--dim:#178b3c;
--dark:#020a03;
--panel:rgba(2,16,5,.91);
}

*{
box-sizing:border-box;
}

html,body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
background:var(--dark);
font-family:"Courier New",monospace;
color:var(--green);
}

#map{
position:absolute;
inset:0;

filter:
grayscale(1)
sepia(1)
hue-rotate(75deg)
saturate(7)
brightness(.40)
contrast(1.6);
}

/* CRT GREEN TINT */

#phosphor{
position:fixed;
inset:0;
pointer-events:none;
z-index:5;
background:rgba(0,255,65,.035);
}

/* CRT SCANLINES */

#scanlines{
position:fixed;
inset:0;
pointer-events:none;
z-index:30;

background:
repeating-linear-gradient(
0deg,
rgba(0,0,0,.15),
rgba(0,0,0,.15) 1px,
transparent 1px,
transparent 4px
);
}

/* HEADER */

#header{
position:fixed;
top:0;
left:0;
right:0;
z-index:20;

padding:
calc(12px + env(safe-area-inset-top))
15px
10px;

background:var(--panel);

border-bottom:
2px solid var(--green);

box-shadow:
0 0 15px
rgba(57,255,114,.18);

text-shadow:
0 0 8px var(--green);
}

#topline{
display:flex;
justify-content:space-between;
align-items:center;
}

#title{
font-size:21px;
font-weight:bold;
letter-spacing:3px;
}

#gpsIndicator{
font-size:11px;
}

#sub{
margin-top:3px;
font-size:9px;
opacity:.7;
letter-spacing:1px;
}

/* SEARCH */

#search{
position:fixed;
z-index:20;

top:
calc(85px + env(safe-area-inset-top));

left:12px;
right:12px;

background:var(--panel);

border:
1px solid var(--green);

padding:10px;

box-shadow:
0 0 10px
rgba(57,255,114,.15);
}

#searchLabel{
font-size:9px;
margin-bottom:5px;
opacity:.7;
}

#destination{
width:100%;

border:none;
outline:none;

color:var(--green);
background:transparent;

font-family:"Courier New",monospace;
font-size:14px;

text-shadow:
0 0 5px var(--green);
}

#destination::placeholder{
color:var(--dim);
}

/* HUD */

#hud{
position:fixed;
z-index:20;

bottom:
calc(68px + env(safe-area-inset-bottom));

left:10px;
right:10px;

background:var(--panel);

border:
1px solid var(--green);

box-shadow:
0 0 12px rgba(57,255,114,.2),
inset 0 0 15px rgba(57,255,114,.04);
}

#status{
padding:8px 10px;

font-size:10px;

border-bottom:
1px solid var(--dim);

text-shadow:
0 0 5px var(--green);
}

#stats{
display:grid;

grid-template-columns:
repeat(3,1fr);

text-align:center;

padding:8px 0;
}

.statLabel{
font-size:8px;
opacity:.6;
}

.statValue{
margin-top:2px;

font-size:18px;
font-weight:bold;

text-shadow:
0 0 7px var(--green);
}

/* CONTROLS */

#controls{
display:flex;

border-top:
1px solid var(--dim);
}

.ctrl{
flex:1;

padding:8px;

border:none;

border-right:
1px solid var(--dim);

background:transparent;

color:var(--green);

font-family:
"Courier New",monospace;

font-weight:bold;
font-size:10px;
}

.ctrl:last-child{
border-right:none;
}

/* BOTTOM NAV */

#nav{
position:fixed;

z-index:20;

bottom:0;
left:0;
right:0;

height:
calc(58px + env(safe-area-inset-bottom));

display:flex;

justify-content:
space-around;

padding-top:13px;

background:#020a03;

border-top:
2px solid var(--green);

text-shadow:
0 0 6px var(--green);
}

.navItem{
font-size:11px;
opacity:.55;
}

.navItem.active{
opacity:1;

border-bottom:
2px solid var(--green);
}

/* PLAYER */

.player{
width:0;
height:0;

border-left:
10px solid transparent;

border-right:
10px solid transparent;

border-bottom:
25px solid var(--green);

filter:
drop-shadow(
0 0 6px var(--green)
);

transform-origin:center;
}

/* DESTINATION MARKER */

.destination-marker{

width:20px;
height:20px;

border:
3px solid var(--green);

border-radius:50%;

box-shadow:
0 0 10px var(--green),
inset 0 0 8px var(--green);

position:relative;

}

.destination-marker:after{

content:"";

position:absolute;

width:4px;
height:4px;

background:
var(--green);

border-radius:50%;

top:5px;
left:5px;

}

/* HIDE DEFAULT CONTROLS */

.maplibregl-control-container{
display:none;
}

</style>

</head>

<body>


<div id="map"></div>

<div id="phosphor"></div>

<div id="scanlines"></div>


<!-- HEADER -->

<div id="header">

<div id="topline">

<div id="title">
PIP-NAV
</div>

<div id="gpsIndicator">
GPS ○
</div>

</div>

<div id="sub">

ROBCO INDUSTRIES //
MOBILE NAVIGATION TERMINAL

</div>

</div>


<!-- DESTINATION SEARCH -->

<div id="search">

<div id="searchLabel">
DESTINATION
</div>

<input
id="destination"
placeholder="> SEARCH WASTELAND..."
autocomplete="off">

</div>


<!-- HUD -->

<div id="hud">

<div id="status">

> SYSTEM READY //
GPS STANDBY

</div>


<div id="stats">


<div>

<div class="statLabel">
SPD
</div>

<div
class="statValue"
id="speed">

--

</div>

</div>


<div>

<div class="statLabel">
DIST
</div>

<div
class="statValue"
id="distance">

--

</div>

</div>


<div>

<div class="statLabel">
ETA
</div>

<div
class="statValue"
id="eta">

--

</div>

</div>


</div>


<div id="controls">

<button
class="ctrl"
id="gpsBtn">

[ ACQUIRE GPS ]

</button>

<button
class="ctrl"
id="centerBtn">

[ CENTER ]

</button>

</div>

</div>


<!-- BOTTOM NAV -->

<div id="nav">

<div
class="navItem active">

[ MAP ]

</div>

<div class="navItem">

[ NAV ]

</div>

<div class="navItem">

[ DATA ]

</div>

</div>


<script
src="https://unpkg.com/maplibre-gl@5.7.1/dist/maplibre-gl.js">
</script>


<script>

/* ================================
   PIP-NAV V0.3
================================ */


const status =
document.getElementById("status");

const speedDisplay =
document.getElementById("speed");

const distanceDisplay =
document.getElementById("distance");

const etaDisplay =
document.getElementById("eta");

const gpsIndicator =
document.getElementById("gpsIndicator");

const destinationInput =
document.getElementById("destination");


let userPosition = null;

let playerMarker = null;

let destinationMarker = null;

let watchID = null;

let tracking = false;

let currentDestination = null;



/* ================================
   MAP
================================ */


const map =
new maplibregl.Map({

container:"map",

style:
"https://demotiles.maplibre.org/style.json",

center:[
-74.25,
40.4
],

zoom:9,

attributionControl:false

});


map.on(
"load",
()=>{

status.innerHTML =
"> MAP DATABASE ONLINE // GPS STANDBY";

}
);



/* ================================
   PLAYER MARKER
================================ */


function createPlayerMarker(){

const element =
document.createElement("div");

element.className =
"player";

playerMarker =
new maplibregl.Marker({

element:element,

anchor:"center"

});

}



/* ================================
   GPS POSITION UPDATE
================================ */


function updatePosition(position){

const coords =
position.coords;


userPosition = [

coords.longitude,

coords.latitude

];


/* CREATE OR MOVE PLAYER */


if(!playerMarker){

createPlayerMarker();

playerMarker

.setLngLat(
userPosition
)

.addTo(map);

}

else{

playerMarker

.setLngLat(
userPosition
);

}


/* SPEED */


if(
coords.speed !== null &&
coords.speed >= 0
){

const mph =
coords.speed * 2.23694;

speedDisplay.innerHTML =
Math.round(mph);

}

else{

speedDisplay.innerHTML =
"0";

}


/* ROTATE PLAYER */


if(coords.heading !== null){

const player =
document.querySelector(
".player"
);

if(player){

player.style.transform =
"rotate(" +
coords.heading +
"deg)";

}

}


gpsIndicator.innerHTML =
"GPS ●";


if(!currentDestination){

status.innerHTML =
"> POSITION TRACKING ACTIVE";

}


/* FOLLOW PLAYER */


if(tracking){

map.easeTo({

center:
userPosition,

zoom:
Math.max(
map.getZoom(),
15
),

duration:700

});

}

}



/* ================================
   GPS ERROR
================================ */


function gpsError(error){

gpsIndicator.innerHTML =
"GPS ×";

status.innerHTML =
"> GPS ERROR // " +
error.message;

}



/* ================================
   START GPS
================================ */


function startGPS(){

if(
!navigator.geolocation
){

status.innerHTML =
"> GPS HARDWARE UNAVAILABLE";

return;

}


status.innerHTML =
"> ACQUIRING SATELLITE SIGNAL...";


tracking = true;


watchID =
navigator.geolocation
.watchPosition(

updatePosition,

gpsError,

{

enableHighAccuracy:true,

maximumAge:1000,

timeout:15000

}

);


document
.getElementById(
"gpsBtn"
)
.innerHTML =
"[ TRACKING ]";

}



/* GPS BUTTON */


document
.getElementById(
"gpsBtn"
)
.onclick =
()=>{

if(
watchID === null
){

startGPS();

}

};



/* CENTER BUTTON */


document
.getElementById(
"centerBtn"
)
.onclick =
()=>{

if(userPosition){

tracking = true;

map.easeTo({

center:
userPosition,

zoom:16,

duration:600

});

}

};



/* MANUAL MAP MOVEMENT */


map.on(
"dragstart",
()=>{

tracking = false;

status.innerHTML =
"> FREE MAP MODE // PRESS CENTER TO FOLLOW";

}
);



/* ================================
   DESTINATION SEARCH
================================ */


async function
searchDestination(query){

if(!userPosition){

status.innerHTML =
"> ACQUIRE GPS BEFORE NAVIGATION";

return;

}


status.innerHTML =
"> SEARCHING WASTELAND DATABASE...";


try{


const searchURL =

"https://nominatim.openstreetmap.org/search" +

"?format=json" +

"&limit=1" +

"&q=" +

encodeURIComponent(
query
);


const response =
await fetch(
searchURL
);


if(!response.ok){

throw new Error(
"SEARCH FAILURE"
);

}


const results =
await response.json();


if(!results.length){

status.innerHTML =
"> DESTINATION NOT FOUND";

return;

}


const destination = [

parseFloat(
results[0].lon
),

parseFloat(
results[0].lat
)

];


currentDestination =
destination;


/* DESTINATION MARKER */


if(destinationMarker){

destinationMarker.remove();

}


const markerElement =
document.createElement(
"div"
);

markerElement.className =
"destination-marker";


destinationMarker =
new maplibregl.Marker({

element:
markerElement,

anchor:"center"

})

.setLngLat(
destination
)

.addTo(map);


status.innerHTML =
"> DESTINATION LOCKED // CALCULATING ROUTE";


await calculateRoute(
destination
);


}

catch(error){

console.error(
error
);

status.innerHTML =
"> SEARCH DATABASE CONNECTION ERROR";

}

}



/* ================================
   ROUTING
================================ */


async function
calculateRoute(destination){


if(!userPosition){

return;

}


const start =
userPosition;


const routeURL =

"https://router.project-osrm.org/route/v1/driving/" +

start[0] +
"," +
start[1] +

";" +

destination[0] +
"," +
destination[1] +

"?overview=full" +

"&geometries=geojson";


try{


const response =
await fetch(
routeURL
);


if(!response.ok){

throw new Error(
"ROUTING FAILURE"
);

}


const data =
await response.json();


if(
!data.routes ||
!data.routes.length
){

status.innerHTML =
"> ROUTE UNAVAILABLE";

return;

}


const route =
data.routes[0];



/* ================================
   DISTANCE
================================ */


const miles =
route.distance /
1609.344;


distanceDisplay.innerHTML =
miles.toFixed(1);



/* ================================
   ETA
================================ */


const totalMinutes =
Math.round(
route.duration / 60
);


if(
totalMinutes >= 60
){

const hours =
Math.floor(
totalMinutes / 60
);

const minutes =
totalMinutes % 60;


etaDisplay.innerHTML =
hours +
"H" +
minutes;

}

else{

etaDisplay.innerHTML =
totalMinutes +
"M";

}



/* ================================
   GEOJSON ROUTE
================================ */


const routeGeoJSON = {

type:"Feature",

properties:{},

geometry:
route.geometry

};



/* REMOVE PREVIOUS ROUTE */


if(
map.getLayer(
"pip-route"
)
){

map.removeLayer(
"pip-route"
);

}


if(
map.getLayer(
"pip-route-glow"
)
){

map.removeLayer(
"pip-route-glow"
);

}


if(
map.getSource(
"route"
)
){

map.removeSource(
"route"
);

}



/* ================================
   ADD ROUTE SOURCE
================================ */


map.addSource(
"route",
{

type:"geojson",

data:
routeGeoJSON

}
);



/* ================================
   ROUTE GLOW
================================ */


map.addLayer({

id:
"pip-route-glow",

type:
"line",

source:
"route",

layout:{

"line-join":
"round",

"line-cap":
"round"

},

paint:{

"line-color":
"#39ff72",

"line-width":
14,

"line-opacity":
0.25,

"line-blur":
7

}

});



/* ================================
   MAIN ROUTE
================================ */


map.addLayer({

id:
"pip-route",

type:
"line",

source:
"route",

layout:{

"line-join":
"round",

"line-cap":
"round"

},

paint:{

"line-color":
"#39ff72",

"line-width":
5,

"line-opacity":
1

}

});



/* ================================
   FIT ROUTE ON SCREEN
================================ */


const bounds =
new maplibregl
.LngLatBounds();


route.geometry
.coordinates
.forEach(
coordinate=>{

bounds.extend(
coordinate
);

}
);


map.fitBounds(

bounds,

{

padding:{

top:190,

bottom:230,

left:40,

right:40

},

duration:1200

}

);


tracking = false;


status.innerHTML =
"> ROUTE LOCKED // NAVIGATION READY";


}

catch(error){

console.error(
error
);

status.innerHTML =
"> ROUTING COMPUTER ERROR";

}

}



/* ================================
   SEARCH BOX
================================ */


destinationInput
.addEventListener(

"keydown",

event=>{


if(
event.key ===
"Enter"
){

event.preventDefault();


const query =

destinationInput
.value
.trim();


if(!query){

return;

}


destinationInput.blur();


searchDestination(
query
);

}

}

);


</script>

</body>

</html>
